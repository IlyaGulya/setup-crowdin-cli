name: Test Action

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: macos-arm64
          - runner: macos-13
            platform: macos-x86_64
          - runner: windows-latest
            platform: windows-x86_64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      
      - name: Build action
        run: pnpm run build
      
      - name: Setup Crowdin CLI (Local Action)
        uses: ./

      - name: Verify Crowdin CLI installation
        run: |
          crowdin --version
          echo "Crowdin CLI was successfully installed for ${{ matrix.platform }}!"

      # 4.x resolves to the standalone repository, 5.x to the official one,
      # so both sources are covered.
      - name: Setup Crowdin CLI (pinned 5.x)
        uses: ./
        with:
          version: '5.0.1'

      - name: Verify pinned 5.x installation
        shell: bash
        run: |
          crowdin --version | grep -q '^5\.0\.1$'

      - name: Setup Crowdin CLI (pinned 4.x)
        uses: ./
        with:
          version: '4.14.1'

      - name: Verify pinned 4.x installation
        shell: bash
        run: |
          crowdin --version | grep -q '^4\.14\.1$'
