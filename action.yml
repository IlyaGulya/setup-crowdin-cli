name: 'Setup Crowdin CLI'
description: 'Set up Crowdin CLI in your GitHub Actions workflow'
author: 'Ilya Gulya'
branding:
  icon: 'download'
  color: 'blue'

inputs:
  version:
    description: >-
      Version of Crowdin CLI to use (e.g. 5.0.1), or "latest".
      Versions 5.0.0 and above are fetched from the official crowdin/crowdin-cli
      releases; 4.4.0-4.15.1 come from ilyagulya/crowdin-cli-standalone.
    required: false
    default: 'latest'
  github_token:
    description: 'GitHub token for API access to fetch release information. If not provided, the default GITHUB_TOKEN will be used.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'dist/index.js' 
